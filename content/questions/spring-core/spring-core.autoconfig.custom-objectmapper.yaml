id: spring-core.autoconfig.custom-objectmapper
version: 3
topic: spring-core
subtopic: boot-autoconfig
level: 4
type: open
tags: [auto-configuration, conditional, jackson]
answerHint: medium
prompt:
  tr: |
    Bir Spring Boot 3 projesinde API'nin JSON alanlarını snake_case döndürmesi istendi. Bir takım arkadaşın şu sınıfı ekledi:

    ```java
    @Configuration
    public class JacksonConfig {
        @Bean
        public ObjectMapper objectMapper() {
            ObjectMapper mapper = new ObjectMapper();
            mapper.setPropertyNamingStrategy(PropertyNamingStrategies.SNAKE_CASE);
            return mapper;
        }
    }
    ```

    Alanlar artık snake_case, ama iki yeni sorun çıktı: `application.yml`'daki
    `spring.jackson.default-property-inclusion: non_null` ayarı etkisini yitirdi (null alanlar yine
    JSON'da görünüyor) ve `LocalDateTime` alanı olan endpoint'ler 500 hatası veriyor.

    Bu iki sorunun ortak sebebi ne? Nasıl düzeltirsin? Aklına gelen çözümlerden hangisini neden
    seçersin?
rubric:
  - { id: r1, weight: 2, required: true, point: { tr: "Ortak sebep: Boot, kendi ObjectMapper'ını yalnızca context'te başka bir ObjectMapper tanımlı değilse oluşturur (auto-configuration geri çekilebilir). Kullanıcı tanımlı bir ObjectMapper olduğu için Boot'unki devre dışı kalır ve Spring MVC artık elle oluşturulan mapper'ı kullanır." } }
  - { id: r2, weight: 2, required: true, point: { tr: "`new ObjectMapper()` Boot'un ayarlarını almaz: `spring.jackson.*` property'leri uygulanmaz ve classpath'teki `JavaTimeModule` gibi modüller kaydedilmez. `LocalDateTime` hatası bu yüzden oluşur." } }
  - { id: r3, weight: 2, required: true, point: { tr: "Doğru düzeltme fikri: ObjectMapper'ı tamamen değiştirmek yerine Boot'un mapper'ını property veya bir customizer mekanizmasıyla özelleştirmek. Belirli sınıf veya property adları zorunlu değildir; fikrin doğru olması yeterlidir." } }
  - { id: r4, weight: 1, point: { tr: "Seçenekleri tartar: property en basit yoldur ama sunulan ayarlarla sınırlıdır; customizer kodla esneklik verir ve varsayılanları korur; kendi ObjectMapper bean'i tam kontrol verir ama Boot'un modül kaydı, feature ayarları ve `spring.jackson.*` desteğini elle taşıma sorumluluğunu getirir." } }
misconceptions:
  - { id: m1, text: { tr: "İki `ObjectMapper` oluştuğunu ve Spring'in rastgele birini seçtiğini söyler; çözüm olarak yalnızca `@Primary` eklemeyi önerir." } }
  - { id: m2, text: { tr: "Kendi bean'ini tanımlayınca Boot'un tüm auto-configuration'ı kapattığını söyler. Geri çekilme yalnızca ilgili koşula bağlı tanımlar için geçerlidir." } }
  - { id: m3, text: { tr: "Sorunu `application.yml`'ın yüklenme sırasına veya `@Order`/`@DependsOn` eksikliğine bağlar." } }
