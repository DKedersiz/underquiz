followUps:
  - ifMissing: r4
    prompt: { tr: "Property, customizer bean'i ve kendi `ObjectMapper` bean'ini tanımlamak arasında nasıl seçim yaparsın? Kendi bean'ini yazmak ne zaman mantıklı olur?" }
  - ifMissing: r1
