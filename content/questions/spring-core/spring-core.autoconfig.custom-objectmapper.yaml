modelAnswer:
  tr: |
    İki sorunun ortak sebebi auto-configuration'ın geri çekilmesi. Boot, `JacksonAutoConfiguration`
    içinde kendi `ObjectMapper`'ını `@ConditionalOnMissingBean` ile tanımlar; context'te bizim
    bean'imiz olduğu için Boot'unkini oluşturmaz ve Spring MVC artık `new ObjectMapper()` ile
    ürettiğimiz nesneyi kullanır. Bu nesne Boot'un `Jackson2ObjectMapperBuilder`'ından geçmediği için
    `spring.jackson.*` ayarları uygulanmaz ve classpath'teki `JavaTimeModule` kaydedilmez;
    `LocalDateTime` bu yüzden serileştirilemez.

    Düzeltme: `JacksonConfig`'i silip `spring.jackson.property-naming-strategy: SNAKE_CASE` eklemek.
    Property'nin karşılamadığı bir ayar gerekirse `Jackson2ObjectMapperBuilderCustomizer` bean'i
    yazarım; Boot'un varsayılanları korunur, benim ayarım üstüne eklenir.

    Seçim: property en az kodla işi görür ama sunulan ayarlarla sınırlıdır. Customizer esneklik verir
    ve varsayılanları korur. Kendi `ObjectMapper` bean'i tam kontrol verir ama Boot'un modül kaydını,
    feature ayarlarını ve property desteğini elle taşımayı gerektirir; bunu yalnızca gerçekten farklı
    bir mapper gerektiğinde, tercihen Boot'un builder'ından üreterek yaparım. Teşhis için `--debug`
    ile açılan conditions report, `jacksonObjectMapper`'ın mevcut bir `ObjectMapper` yüzünden devreye
    girmediğini gösterir.
explanation:
  tr: "Auto-configuration geri çekilebilir: aynı tipte kendi bean'ini tanımladığında Boot'un `@ConditionalOnMissingBean` ile korunan tanımı devreden çıkar ve onunla gelen tüm varsayılanlar da kaybolur. Bir auto-configured bean'i değiştirmeden önce Boot'un sunduğu property ve customizer noktalarına bakmak gerekir."
